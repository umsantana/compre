# /etc/nginx/sites-available/hml.compre.amazonminas.com.br  (homologação)
server {
    listen 80;
    server_name hml.compre.amazonminas.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hml.compre.amazonminas.com.br;
    ssl_certificate     /etc/letsencrypt/live/hml.compre.amazonminas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hml.compre.amazonminas.com.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/compre/hml/current/frontend/dist;
    index index.html;
    auth_basic "Homologação";
    auth_basic_user_file /etc/nginx/.htpasswd-compre-hml;   # criar com: sudo htpasswd -c /etc/nginx/.htpasswd-compre-hml usuario
    add_header X-Robots-Tag "noindex" always;
    location / { try_files $uri /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/login {
        limit_req zone=compre_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/public/leads {
        auth_basic off;
        limit_req zone=compre_leads burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
